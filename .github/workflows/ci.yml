name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # builtin.rs 不入库（含真实 secret），构建前从模板生成空实现。
      - name: 生成 builtin.rs 模板
        shell: pwsh
        run: Copy-Item crates/app-services/src/builtin.rs.example crates/app-services/src/builtin.rs

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # 缓存键带上 manifest 变更，避免依赖变化后复用陈旧产物。
          workspaces: "."

      - name: Rust 格式检查
        run: cargo fmt --all -- --check

      - name: Rust Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust 测试
        run: cargo test --workspace

      - name: 前端格式检查
        run: pnpm format:check

      - name: 前端类型检查
        run: pnpm typecheck

      - name: 前端 lint
        run: pnpm lint

      - name: 前端构建
        run: pnpm build
