name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 生成 builtin.rs 模板
        shell: pwsh
        run: Copy-Item crates/app-services/src/builtin.rs.example crates/app-services/src/builtin.rs

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 抹掉构建机路径再打包，
      # 否则 exe 里会带 C:\Users\<runner> 这类路径。
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=repo --remap-path-prefix=C:\Users\runneradmin=cargo
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LAGM ${{ github.ref_name }}
          releaseBody: 见改动列表。安装包为 NSIS，需 Windows 10/11 + WebView2。
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
